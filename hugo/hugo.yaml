baseURL: https://blog.visionloong.com/
locale: zh-cn
title: wxloong08
theme: stack
publishDir: ../docs
hasCJKLanguage: true
enableEmoji: true

params:
  mainSections:
    - posts
  featuredImageField: image
  rssFullContent: true
  favicon: /favicon.svg

  dateFormat:
    published: 2006-01-02
    lastUpdated: 2006-01-02 15:04

  sidebar:
    emoji: ⚡
    subtitle: AI 编程工具链 · VPS 架构 · 网页抓取

  article:
    math: false
    toc: true
    readingTime: true

  comments:
    enabled: false

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  opengraph:
    twitter:
      site:
      card: summary_large_image

  defaultImage:
    opengraph:
      enabled: false
      local: false
      src:

  colorScheme:
    toggle: true
    default: auto

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 1
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 2
    - identifier: about
      name: 关于
      url: /about/
      weight: 3
    - identifier: github
      name: GitHub
      url: https://github.com/wxloong08
      weight: 4
      params:
        newTab: true

  social:
    - identifier: github
      name: GitHub
      url: https://github.com/wxloong08
      params:
        icon: link

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 100

markup:
  highlight:
    style: dracula
    noClasses: false
